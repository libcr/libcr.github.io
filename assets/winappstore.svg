<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Microsoft Store</title>
  <desc id="desc">Blue shopping bag with the four-color Microsoft symbol.</desc>
  <defs>
    <linearGradient id="bag" x1="76" y1="78" x2="414" y2="486" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0878cf"/>
      <stop offset="0.5" stop-color="#155d9d"/>
      <stop offset="1" stop-color="#293b5d"/>
    </linearGradient>
    <linearGradient id="bag-sheen" x1="102" y1="81" x2="359" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1686da" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#1f67a6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#203a61" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="handle" x1="256" y1="25" x2="256" y2="115" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#24d4f2"/>
      <stop offset="0.48" stop-color="#08a9eb"/>
      <stop offset="1" stop-color="#078bc8"/>
    </linearGradient>
    <filter id="bag-shadow" x="-12%" y="-10%" width="124%" height="130%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="blur"/>
      <feOffset in="blur" dy="8" result="offset"/>
      <feFlood flood-color="#020b19" flood-opacity="0.34" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tile-shadow" x="-30%" y="-30%" width="160%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dy="7" result="offset"/>
      <feFlood flood-color="#07162c" flood-opacity="0.5" result="color"/>
      <feComposite in="color" in2="offset" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <path fill="url(#bag)" filter="url(#bag-shadow)" d="M48 84h416c12.2 0 22 9.8 22 22v297c0 44.7-36.3 81-81 81H108c-44.7 0-81-36.3-81-81V105c0-11.6 9.4-21 21-21z"/>
  <path fill="url(#bag-sheen)" d="M48 84h416c12.2 0 22 9.8 22 22v297c0 44.7-36.3 81-81 81H108c-44.7 0-81-36.3-81-81V105c0-11.6 9.4-21 21-21z"/>

  <path d="M146 99V57c0-9.4 7.6-17 17-17h186c10.5 0 19 8.5 19 19v40" fill="none" stroke="url(#handle)" stroke-width="31" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#tile-shadow)">
    <path fill="#f25022" d="M161 187h88v90h-88z"/>
    <path fill="#7fba00" d="M264 187h89v90h-89z"/>
    <path fill="#00a4ef" d="M161 291h88v89h-88z"/>
    <path fill="#ffb900" d="M264 291h89v89h-89z"/>
  </g>
</svg>
